#------------------------------------------------------------------------------
# COL729 Lab 1
# SPEC CPU2017 configuration for Intel ICC
#------------------------------------------------------------------------------
# Parameters
%ifndef %{bits}
%   define bits 64
%endif
%ifndef %{opt}
%   define opt O2
%endif
%ifndef %{build_ncpus}
%   define build_ncpus 16
%endif
# Architecture
%define os LINUX
%if %{bits} == 64
%   define model -m64
%elif %{bits} == 32
%   define model -m32
%else
%   error bits must be either 32 or 64
%endif
# Global settings
command_add_redirect = 1
ignore_errors = 1
iterations    = 1
label         = icc-%{opt}-m%{bits}
line_width     = 1020
log_line_width = 1020
makeflags     = -j%{build_ncpus}
mean_anyway   = 1
output_format = txt,csv
preenv        = 1
reportable    = 0
tune          = base
# One benchmark copy, matching GCC and Clang
intrate,fprate:
   copies = 1
# Compilers
default:
   CC  = /opt/intel/oneapi/compiler/2023.2.4/linux/bin/intel64/icc %{model}
   CXX = /opt/intel/oneapi/compiler/2023.2.4/linux/bin/intel64/icpc %{model}
   CC_VERSION_OPTION  = --version
   CXX_VERSION_OPTION = --version
# Pointer size
default:
%if %{bits} == 64
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit
%else
   sw_base_ptrsize = 32-bit
   sw_peak_ptrsize = 32-bit
%endif
# General portability
default:
%if %{bits} == 32
   EXTRA_PORTABILITY = -D_FILE_OFFSET_BITS=64
%else
   EXTRA_PORTABILITY = -DSPEC_LP64
%endif
# perlbench portability
500.perlbench_r,600.perlbench_s:
%if %{bits} == 32
%   define suffix IA32
%else
%   define suffix X64
%endif
   PORTABILITY = -DSPEC_%{os}_%{suffix}
# omnetpp portability
520.omnetpp_r:
   CXXPORTABILITY = -std=c++14
# xalancbmk portability
523.xalancbmk_r,623.xalancbmk_s:
   PORTABILITY = -DSPEC_%{os}
# Optimization level
#
# Deliberately only O0/O1/O2/O3.
# No -xHOST, IPO, -qopt-prefetch, -Ofast, auto-parallelization, etc.
default=base:
   OPTIMIZE = -%{opt}
#------------------------------------------------------------------------------
# End
#------------------------------------------------------------------------------

